# docker-compose.dev.yml
# Dev override: bind-mount source for hot reload.
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
version: '3.8'

services:
  backend:
    volumes:
      - ./backend:/app
      - /app/.venv
      - /app/__pycache__
    # --reload-dir restricts the file watcher to source code only. Without
    # it, uvicorn watches the whole /app tree, including uploads/ and
    # outputs/ - large in-progress video downloads there flood the watcher
    # with filesystem events fast enough to crash it (WatchfilesRustInternalError:
    # "Cannot allocate memory").
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "app"]

  worker:
    volumes:
      - ./backend:/app
      - /app/.venv
      - /app/__pycache__
    # Deliberately no --reload / file-watcher here: restart the worker
    # container manually after code changes (`docker compose restart worker`).
    # RQ jobs run in forked child processes; if a file watcher crashed the
    # worker's main process mid-job the same way it crashed uvicorn's, the
    # in-progress job's process would be orphaned with no supervisor to
    # ever mark it failed until the next startup's orphan-recovery pass.
    command: ["python", "worker.py"]

  frontend:
    build:
      context: ./frontend
      target: build
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: ["npm", "run", "dev", "--", "--host"]
